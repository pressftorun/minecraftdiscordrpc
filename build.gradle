plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.1'
}

group = 'dev.worldpresence'
version = '1.5.2+1.21.11'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.terraformersmc.com/releases/' }
        }
        filter { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modCompileOnly('com.terraformersmc:modmenu:17.0.1') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('selfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.worldpresence.PresenceTextTest'
    enableAssertions = true
}
check.dependsOn selfTest
// Checks use the runnable selfTest above, without a test framework.
test { failOnNoDiscoveredTests = false }
