plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.1'
}

group = 'dev.worldpresence'
version = '1.5.1'

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.terraformersmc.com/releases/' }
        }
        filter { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    compileOnly('com.terraformersmc:modmenu:21.0.0') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('selfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.worldpresence.PresenceTextTest'
    enableAssertions = true
}
check.dependsOn selfTest
// Checks use the runnable selfTest above, without a test framework.
test { failOnNoDiscoveredTests = false }
